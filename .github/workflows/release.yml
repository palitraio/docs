# Publishes help-index.json, the article fragments the Palitra Chat help search loads, as a GitHub
# release asset on every push to main. palitra-backend's image build downloads the latest one.
name: Release help index

on:
  push:
    branches: [main]

# Two quick merges must publish in merge order, so the latest release is the newest content.
concurrency:
  group: release-help-index
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Name the release
        id: tag
        run: echo "tag=docs-$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build help-index.json
        env:
          HELP_INDEX_VERSION: ${{ steps.tag.outputs.tag }}
        run: pnpm build:help-index

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" dist/help-index.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Help index built from $GITHUB_SHA."
